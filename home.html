<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- tailwind&daisy ui added -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <!-- font awesome icon cdn added -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
      <!-- google font added -->
       <link rel="preconnect" href="https://fonts.googleapis.com">
       <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
     <!-- css style added -->
      <link rel="stylesheet" href="./styles/style.css">
      <title>Home</title>
</head>
<body class="geist bg-[#F8FAFC]">

  <header class="flex justify-around items-center py-3 shadow bg-white mb-2 sm:mb-8">
    <div class="flex items-center gap-1">
      <img class="w-9" src="./assets/github-logo.png" alt="">
      <p class="font-semibold sm:text-2xl">GitHub Issues Tracker</p>
    </div>
    <div class="flex gap-4">

      <label class="input ">
      <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <g
      stroke-linejoin="round"
      stroke-linecap="round"
      stroke-width="2.5"
      fill="none"
      stroke="currentColor"
    >
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.3-4.3"></path>
    </g>
      </svg>

 <input id="inputPassword" type="password" class="hidden input  sm:block w-full" placeholder="Search issues..." />
</label>
      
     
      <button class="btn hidden sm:block btn-primary">+ New Issue</button>
    </div>
  </header>

  <main class="w-[80%] sm:w-[1110px] mx-auto">

    <section class="p-2 sm:p-4 flex gap-3 justify-center sm:justify-normal shadow bg-white">
      <button class="btn btn-primary">All</button>
      <button class="btn btn-primary">Open</button>
      <button class="btn btn-primary">Closed</button>
    </section>

    <section class="bg-white shadow mt-6 p-4 flex justify-between">
      <div class="flex items-center gap-3">
        <div><img src="./assets/Aperture.png" alt=""></div>
        <div>
          <p>50 Issues</p>
          <p>Track and manage your project issues</p>
        </div>
      </div>
      <div class="sm:flex gap-4">
       <div class="flex items-center justify-center gap-3">
        <div  class="w-3 h-3 rounded-full bg-green-700"></div>
        <p >Open</p>
       </div>
       <div class="flex items-center justify-center gap-3">
        <div  class="w-3 h-3 rounded-full bg-purple-700"></div>
        <p>Closed</p>
       </div>
        
      </div>
    </section>
  </main>


  <!-- JavaScript added -->
    <script src="./scripts/home.js"></script>
</body>
</html>
