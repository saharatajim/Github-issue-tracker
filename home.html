<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- tailwind&daisy ui added -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <!-- font awesome icon cdn added -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
      <!-- google font added -->
       <link rel="preconnect" href="https://fonts.googleapis.com">
       <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
     <!-- css style added -->
      <link rel="stylesheet" href="./styles/style.css">
      <title>Home</title>
</head>
<body class="geist bg-[#F8FAFC]">
<!-- navbar section -->
  <header class="flex justify-around items-center py-3 shadow bg-white mb-2 sm:mb-8">
    <div class="flex items-center gap-1">
      <img class="w-9" src="./assets/github-logo.png" alt="">
      <p class="font-semibold sm:text-2xl">GitHub Issues Tracker</p>
    </div>
    <div class="flex gap-4">

  

 <input id="inputPassword" type="password" class="hidden input  sm:block w-full" placeholder="Search issues..." />

      
     
      <button class="btn hidden sm:block btn-primary">+ New Issue</button>
    </div>
  </header>

  <main class="w-[80%] sm:w-[1110px] mx-auto pb-14">
<!-- toggling button section -->
    <section class="p-2 sm:p-4 flex gap-3 justify-center sm:justify-normal shadow bg-white">
      <button class="btn btn-primary">All</button>
      <button class="btn btn-base ">Open</button>
      <button class="btn btn-base ">Closed</button>
    </section>
<!-- open-close counting section -->
    <section class="bg-white shadow mt-6 p-4 flex justify-between">
      <div class="flex items-center gap-3">
        <div><img src="./assets/Aperture.png" alt=""></div>
        <div>
          <p>50 Issues</p>
          <p>Track and manage your project issues</p>
        </div>
      </div>
      <div class="sm:flex gap-4">
       <div class="flex items-center justify-center gap-3">
        <div  class="w-3 h-3 rounded-full bg-green-700"></div>
        <p >Open</p>
       </div>
       <div class="flex items-center justify-center gap-3">
        <div  class="w-3 h-3 rounded-full bg-purple-700"></div>
        <p>Closed</p>
       </div>
        
      </div>
    </section>
<!-- all cards container section  -->
 <section id="allCardsContainer" class="bg-white shadow mt-1 grid sm:grid-cols-4 p-4 gap-3">
  <!-- dynamically all cards will be loaded here -->
  
 </section>

 <section>

<!-- Open the modal using ID.showModal() method -->
<!-- <button class="btn" onclick="my_modal_5.showModal()">open modal</button> -->
 
<dialog id="issueDetails" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box">
    <h3 class="text-lg font-bold">Hello!</h3>
    <p class="py-4">Press ESC key or click the button below to close</p>
    <div class="modal-action">
      <form method="dialog">
        <!-- if there is a button in form, it will close the modal -->
        <button class="btn">Close</button>
      </form>
    </div>
  </div>
</dialog>
 </section>
  </main>


  <!-- JavaScript added -->
    <script src="./scripts/home.js"></script>
</body>
</html>
