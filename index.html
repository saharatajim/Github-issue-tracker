<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- tailwind&daisy ui added -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <!-- font awesome icon cdn added -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
      <!-- google font added -->
       <link rel="preconnect" href="https://fonts.googleapis.com">
       <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
     <!-- css style added -->
      <link rel="stylesheet" href="./styles/style.css">
      <title>Login</title>
</head>
<body class="geist bg-[#64748B]">
<div class="hero bg-base-200 min-h-screen ">
  <div class="hero-content flex flex-col shadow-xl bg-white rounded-2xl p-8 w-[520px]">
      <div class="text-center ">
     <div class="flex justify-center mb-6"> <img src="./assets/github-logo.png" alt=""></div>
      <div>
        <p class="font-semibold text-2xl">GitHub Issues Tracker</p>
        <p class="text-base text-[#64748B]">Sign in to manage your issues</p>
      </div>
       </div>
       <div class="card bg-base-100 w-full max-w-sm shrink-0 ">
      
        <fieldset class="fieldset">
          <label class="label font-medium"> Username</label>
          <input type="email" class="input w-full" placeholder="Enter Username" />
          <p class="text-sm text-[#4A00FF]">Default: admin</p>
          <label class="label font-medium">Password</label>
          <input type="password" class="input w-full" placeholder="Enter Password" />
          <p class="text-sm text-[#4A00FF]">Default: admin123</p>
          
          <button class="btn bg-[#4A00FF] mt-4 text-white font-semibold">Sign In</button>
        </fieldset>

        <div class=" flex  items-center my-6">
          <p class="flex-grow border-t border-gray-300"></p>
          <p>OR</p>
           <p class=" flex-grow border-t border-gray-300"></p>
       </div>

       <div class="text-center">
        <h1>Demo Credentials:</h1>
        <div class="card bg-[#F8FAFC] py-6">
            <p>Username: admin</p>
            <p>Password: admin123</p>
        </div>
       </div>
      
    </div>
  </div>
</div>
  <!-- JavaScript added -->
    <script src="./scripts/login.js"></script>
</body>
</html>
